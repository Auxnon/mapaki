[package]
name = "mapaki"
version = "0.1.0"
edition = "2021"
description = "mapaki desktop sync client"

[dependencies]
data-encoding = "2"
dirs = "5"
notify = "6"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
toml = { version = "1.2.2", default-features = false, features = ["std", "parse", "serde"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempdir = "0.3"

[profile.release]
opt-level = "z"
lto = true
strip = true
