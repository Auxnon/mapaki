# Builds and publishes a GitHub release when a v* tag is pushed
# (scripts/release.sh creates the tag). Asset names carry no version so
# install.sh can always fetch releases/latest/download/<asset>.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          [ "$tag" = "$file" ] || { echo "tag v$tag != VERSION $file"; exit 1; }

  linux-binaries:
    needs: check-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Test
        run: |
          cargo test --manifest-path daemon/Cargo.toml
          cargo test --manifest-path client/Cargo.toml
      - name: Build static binaries
        run: |
          cargo zigbuild --release --target ${{ matrix.target }} --manifest-path daemon/Cargo.toml
          cargo zigbuild --release --target ${{ matrix.target }} --manifest-path client/Cargo.toml
      - name: Stage
        run: |
          arch="${{ matrix.target }}"; arch="${arch%%-*}"
          mkdir dist
          cp daemon/target/${{ matrix.target }}/release/mapaki-daemon "dist/mapaki-daemon-linux-$arch"
          cp client/target/${{ matrix.target }}/release/mapaki "dist/mapaki-linux-$arch"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: dist/*

  android:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MAPAKI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; APK is signed with a throwaway debug key"
          fi
      - name: Build APK
        working-directory: app
        env:
          MAPAKI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MAPAKI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAPAKI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --console=plain
      - name: Stage
        run: |
          mkdir dist
          cp app/app/build/outputs/apk/release/app-release.apk dist/mapaki-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  publish:
    needs: [linux-binaries, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: mapaki ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
            install.sh
